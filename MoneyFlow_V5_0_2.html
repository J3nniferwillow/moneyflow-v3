<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoneyFlow 5.0.2</title><style>*{box-sizing:border-box}body{margin:0;background:#faf5ef;color:#654e48;font:16px system-ui,-apple-system,sans-serif}main{max-width:650px;margin:auto;padding:20px 16px 80px}h1{margin:0}h2{font-size:19px}small,p{line-height:1.6}section{background:white;border-radius:18px;padding:18px;margin:14px 0}button,input,select{font:inherit;border:1px solid #e2ccc5;border-radius:10px;padding:10px;max-width:100%;color:inherit;background:white}button{background:#efd9d5;cursor:pointer}label{display:block;margin:10px 0}nav{display:flex;gap:8px;flex-wrap:wrap}.hero{background:#efd9d5}.big{font-size:32px;font-weight:700}.bar{height:8px;background:#f1e7e1;border-radius:8px;margin:6px 0 14px}.bar i{display:block;background:#bb8d83;height:100%;border-radius:8px}table{width:100%;font-size:13px;border-collapse:collapse}td,th{text-align:left;padding:8px 3px;border-bottom:1px solid #eee;overflow-wrap:anywhere} .muted{color:#897770} [hidden]{display:none!important}</style><main><h1>MoneyFlow <small>5.0.2</small></h1><p class="muted">少一点消费焦虑，多一点储蓄底气。</p><nav><button onclick="show('home')">首页</button><button onclick="show('analysis')">分析</button><button onclick="show('import')">导入</button><button onclick="show('data')">数据与备份</button></nav><label>分析月份 <input id="month" type="month"></label><div id="home"><section class="hero"><small>本月收入减已确认消费（非实际现金余额）</small><div class="big" id="net"></div><p id="overview"></p></section><section><h2>本月财务建议</h2><div id="advice"></div></section></div><div id="analysis" hidden><section><h2>消费结构</h2><div id="categories"></div></section><section><h2>历史月份</h2><div id="trend"></div></section><section><h2>待确认及其他资金流</h2><div id="other"></div><div id="review"></div></section></div><div id="import" hidden><section><h2>录入工资</h2><form id="salary"><label>到账日期 <input type="date" id="date" required></label><label>实际到账金额 <input type="number" id="amount" min="0.01" step="0.01" required></label><button>保存工资</button></form></section><section><h2>导入支付账单</h2><p>支持支付宝记账本 CSV、支付宝交易流水 CSV、微信 CSV / XLSX。不同来源可能重复，请勿重复导入同一消费。导入前自动检查字段；无法判断的交易进入待确认。</p><input id="file" type="file" accept=".csv,.xlsx,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple><p id="status" role="status"></p><button id="confirm" hidden>确认导入</button></section></div><div id="data" hidden><section><h2>本地数据</h2><p id="count"></p><button onclick="backup()">导出 JSON 备份</button><label>恢复备份（替换现有数据）<input id="restore" type="file" accept=".json"></label><p>数据仅保存在当前浏览器，暂不跨设备同步。请定期备份。</p><div id="records"></div></section></div></main><script>
'use strict';const $=id=>document.getElementById(id),key='MoneyFlow5';let rows=[],pending=[];try{rows=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(rows))throw Error()}catch(e){rows=[];alert('本地数据读取失败，请检查备份。')}const today=new Date(),localDate=()=>`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;$('month').value=localDate().slice(0,7);$('date').value=localDate();const types=['消费','退款','个人往来','还款','资金转移','借入','其他收入','待确认','工资'];const money=n=>'¥'+n.toFixed(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(next){try{localStorage.setItem(key,JSON.stringify(next));rows=next;render();return true}catch(e){alert('保存失败，浏览器存储可能已满或不可用。');return false}}function show(id){for(const k of ['home','analysis','import','data'])$(k).hidden=k!==id;render()}function csv(s){let out=[],r=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){v+='"';i++}else if(q||v==='')q=!q;else v+=c}else if(!q&&c===','){r.push(v);v=''}else if(!q&&(c==='\n'||c==='\r')){if(c==='\r'&&s[i+1]==='\n')i++;r.push(v);out.push(r);r=[];v=''}else v+=c}if(q)throw Error('CSV 引号不完整');if(v||r.length){r.push(v);out.push(r)}return out}function parse(s){const a=Array.isArray(s)?s:csv(s.replace(/^\uFEFF/,'')),clean=x=>String(x||'').trim();let h=a.findIndex(r=>r.some(x=>['交易时间','交易日期','记录时间'].includes(clean(x)))&&r.some(x=>/^金额/.test(clean(x)))&&r.some(x=>['收/支','收支类型'].includes(clean(x))));if(h<0)throw Error('未找到交易时间、金额及收/支字段');const headers=a[h].map(clean),wx=headers.includes('交易对方')&&headers.includes('当前状态'),book=headers.includes('记录时间'),platform=wx?'微信':book?'支付宝记账本':'支付宝';let result=[],skipped=0;for(const r of a.slice(h+1)){const get=(...names)=>{for(const n of names){let i=headers.indexOf(n);if(i>=0)return clean(r[i])}return ''};let dateText=get('交易时间','交易日期','记录时间');if(wx&&/^\d+(?:\.\d+)?$/.test(dateText)&&Number(dateText)>=61&&Number(dateText)<2958466){dateText=new Date(Date.UTC(1899,11,30)+Math.floor(Number(dateText))*86400000).toISOString().slice(0,10)}let d=dateText.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);if(!d){if(r.some(x=>clean(x)))skipped++;continue;}let raw=get('金额(元)','金额（元）','金额'),amount=Number(raw.replace(/[¥￥,\s]/g,''));if(!raw||!Number.isFinite(amount)||amount<=0){skipped++;continue}let status=get('交易状态','当前状态');if(/关闭|失败|未支付|待支付|已取消/.test(status)){skipped++;continue}let dir=get('收/支','收支类型'),cat=get('交易分类','交易类型','分类'),desc=get('商品说明','商品','商品名称','备注'),party=get('交易对方'),id=get('交易订单号','交易单号'),all=cat+' '+desc;let type='待确认';if(/退款/.test(cat)||/退款/.test(desc)&&dir==='收入')type='退款';else if(/借还款/.test(cat))type='待确认';else if(/还款/.test(all))type='还款';else if(/提现|充值|资金划转|余额宝|零钱通|投资理财|小荷包/.test(all))type='资金转移';else if(/转账|红包|亲属卡/.test(cat))type='个人往来';else if(/借款|借入/.test(cat))type='借入';else if(book&&dir==='支出'&&!/其他|生意|金融保险/.test(cat))type='消费';else if(dir==='支出'&&(/消费|购物|餐饮|交通|生活|娱乐|医疗|教育|服饰|食品|日用|商户|扫二维码付款/.test(cat)))type='消费';else if(dir==='收入'&&/收入|收款/.test(cat))type='其他收入';let category=/餐|饮|食品|外卖/.test(all)?'餐饮':/购物|服饰|日用|穿搭美容/.test(all)?'购物':/娱乐|游戏|运动|休闲玩乐/.test(all)?'娱乐':/交通|出行/.test(all)?'交通':/生活|住房|水电/.test(all)?'生活':'其他';result.push({date:`${d[1]}-${d[2].padStart(2,'0')}-${d[3].padStart(2,'0')}`,amount,type,category,desc:desc||party||cat,platform,id,dir,uid:Math.random().toString(36).slice(2)+Date.now()})}if(!result.length)throw Error('没有可导入的有效交易');return {result,skipped}}
async function xlsx(b){const u=new Uint8Array(b),v=new DataView(b);let end=-1;for(let i=u.length-22;i>=Math.max(0,u.length-65557);i--)if(v.getUint32(i,true)===0x06054b50){end=i;break}if(end<0)throw Error('Excel 文件不完整');let pos=v.getUint32(end+16,true),count=v.getUint16(end+10,true),files=new Map();for(let j=0;j<count;j++){if(v.getUint32(pos,true)!==0x02014b50)throw Error('Excel 目录异常');let method=v.getUint16(pos+10,true),size=v.getUint32(pos+20,true),expanded=v.getUint32(pos+24,true),n=v.getUint16(pos+28,true),e=v.getUint16(pos+30,true),c=v.getUint16(pos+32,true),off=v.getUint32(pos+42,true),name=new TextDecoder().decode(u.slice(pos+46,pos+46+n));files.set(name,{method,size,expanded,off});pos+=46+n+e+c}async function read(name){let f=files.get(name);if(!f)return null;if(f.expanded>30000000)throw Error('Excel 文件过大');let start=f.off+30+v.getUint16(f.off+26,true)+v.getUint16(f.off+28,true),data=u.slice(start,start+f.size);if(f.method===8){if(!globalThis.DecompressionStream)throw Error('浏览器不支持 Excel 解压，请使用 CSV');data=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}else if(f.method!==0)throw Error('不支持的 Excel 压缩格式');return new DOMParser().parseFromString(new TextDecoder().decode(data),'application/xml')}let shared=await read('xl/sharedStrings.xml'),strings=shared?Array.from(shared.getElementsByTagName('si'),x=>Array.from(x.getElementsByTagName('t'),t=>t.textContent).join('')):[],sheet=await read('xl/worksheets/sheet1.xml');if(!sheet)throw Error('未找到首张工作表');return Array.from(sheet.getElementsByTagName('row'),r=>{let a=[];for(let c of r.getElementsByTagName('c')){let col=(c.getAttribute('r')||'A').match(/^[A-Z]+/)[0],i=0;for(let ch of col)i=i*26+ch.charCodeAt(0)-64;let t=c.getAttribute('t'),val=c.getElementsByTagName('v')[0]?.textContent||'';a[i-1]=t==='s'?strings[Number(val)]:t==='inlineStr'?Array.from(c.getElementsByTagName('t'),x=>x.textContent).join(''):val}return Array.from(a,x=>x||'')})}
$('file').onchange=async()=>{pending=[];$('confirm').hidden=true;let notes=[];for(const f of $('file').files){try{let b=await f.arrayBuffer(),s=new TextDecoder('utf-8').decode(b);if(s.includes('\uFFFD'))s=new TextDecoder('gb18030').decode(b);let p=parse(/\.xlsx$/i.test(f.name)?await xlsx(b):s);pending.push(...p.result);notes.push(`${f.name}：识别 ${p.result.length} 笔，跳过 ${p.skipped} 笔无效或未完成交易`)}catch(e){notes.push(`${f.name}：${e.message}`)}}$('status').textContent=notes.join('；');$('confirm').hidden=!pending.length};$('confirm').onclick=()=>{let next=rows.slice(),seen=new Set(rows.filter(r=>r.id).map(r=>r.platform+':'+r.id)),n=0;for(const r of pending){let k=r.platform+':'+r.id;if(r.id&&seen.has(k))continue;if(r.id)seen.add(k);next.push(r);n++}if(save(next)){$('status').textContent=`已导入 ${n} 笔，跳过 ${pending.length-n} 笔同平台订单重复记录。无订单号记录不会自动去重。`;pending=[];$('confirm').hidden=true;$('file').value=''}};$('salary').onsubmit=e=>{e.preventDefault();let amount=Number($('amount').value);if(amount>0&&save([...rows,{date:$('date').value,amount,type:'工资',category:'工资',desc:'手动录入工资',platform:'手动',uid:Math.random().toString(36).slice(2)+Date.now()}])){$('month').value=$('date').value.slice(0,7);$('amount').value='';show('home')}};function stats(rs){let sum=t=>rs.filter(r=>r.type===t).reduce((a,r)=>a+r.amount,0);return {income:sum('工资')+sum('其他收入'),spend:sum('消费'),refund:sum('退款'),unknown:sum('待确认')}}function render(){let rs=rows.filter(r=>r.date.slice(0,7)===$('month').value),s=stats(rs),net=s.income-s.spend;$('net').textContent=rs.length?money(net):'暂无数据';$('overview').textContent=`已识别收入 ${money(s.income)} · 消费 ${money(s.spend)} · 未关联退款 ${money(s.refund)}`;let cats={};rs.filter(r=>r.type==='消费').forEach(r=>cats[r.category]=(cats[r.category]||0)+r.amount);let sorted=Object.entries(cats).sort((a,b)=>b[1]-a[1]);$('categories').innerHTML=sorted.map(([k,v])=>`<div>${esc(k)}　${money(v)}　${(v/s.spend*100).toFixed(1)}%</div><div class="bar"><i style="width:${v/s.spend*100}%"></i></div>`).join('')||'暂无已确认消费';$('advice').textContent=!rs.length?'先导入账单并录入工资，生成分析。':!s.income?'尚未录入或识别收入，暂不能评估储蓄能力。':`已识别收入减消费为 ${money(net)}。${sorted.length?'最大消费类别为'+sorted[0][0]+'，可优先检查其中非必要支出。':''} 先预留生活费及待还款，再决定储蓄金额。${s.unknown?'还有 '+money(s.unknown)+' 待确认交易。':''} 当前未掌握完整资产及负债，不将此差额视为可储蓄金额。`;$('trend').innerHTML=[...new Set(rows.map(r=>r.date.slice(0,7)))].sort().reverse().map(m=>{let x=stats(rows.filter(r=>r.date.startsWith(m)));return `<p>${esc(m)}　收入 ${money(x.income)}　消费 ${money(x.spend)}</p>`}).join('')||'暂无历史数据';$('other').innerHTML=types.filter(t=>!['消费','工资','其他收入'].includes(t)).map(t=>`<p>${t}：${money(rs.filter(r=>r.type===t).reduce((a,r)=>a+r.amount,0))}</p>`).join('');$('review').innerHTML=rs.filter(r=>r.type==='待确认').map(r=>`<p>${esc(r.date)} ${esc(r.desc)} ${money(r.amount)} (${esc(r.dir)}) <select data-uid="${esc(r.uid)}">${types.map(t=>`<option ${t===r.type?'selected':''}>${t}</option>`).join('')}</select></p>`).join('');$('count').textContent=`共 ${rows.length} 条记录`;$('records').innerHTML=rs.map(r=>`<p>${esc(r.date)} ${esc(r.desc)} ${money(r.amount)} <select data-uid="${esc(r.uid)}">${types.map(t=>`<option ${t===r.type?'selected':''}>${t}</option>`).join('')}</select> <button data-delete="${esc(r.uid)}">删除</button></p>`).join('')}
document.addEventListener('change',e=>{if(e.target.dataset.uid)save(rows.map(r=>r.uid===e.target.dataset.uid?{...r,type:e.target.value}:r))});document.addEventListener('click',e=>{if(e.target.dataset.delete&&confirm('删除这条记录？'))save(rows.filter(r=>r.uid!==e.target.dataset.delete))});$('month').onchange=render;function backup(){let u=URL.createObjectURL(new Blob([JSON.stringify({version:5,rows},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='MoneyFlow_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('restore').onchange=async()=>{try{let x=JSON.parse(await $('restore').files[0].text());if(x.version!==5||!Array.isArray(x.rows)||!x.rows.every(r=>r&&typeof r.uid==='string'&&typeof r.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&Number.isFinite(r.amount)&&r.amount>0&&types.includes(r.type)))throw Error('备份格式不正确');if(confirm('替换当前全部数据？'))save(x.rows)}catch(e){alert(e.message)}$('restore').value=''};render();</script></html>
